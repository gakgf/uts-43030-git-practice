name: Vowel frequency analyzer
description: Analyze a UTF-8 file and append actual vowel counts to a report
inputs:
  file:
    description: Input path relative to the checkout
    required: true
  readme:
    description: Report path relative to the checkout
    default: practicals/lecture3/README.md
  actor:
    description: Actual triggering GitHub username
    required: true
  source-sha:
    description: Source commit being analyzed
    required: true
runs:
  using: docker
  image: docker://ghcr.io/gakgf/uts-43030-vowel-frequency@sha256:db65854254b1fcd50038d482d63cd15c31e5f0a71ae29a0fcbb48a3918efb58e
  env:
    FILE: ${{ inputs.file }}
    README_PATH: ${{ inputs.readme }}
    GITHUB_USER: ${{ inputs.actor }}
    SOURCE_SHA: ${{ inputs.source-sha }}
